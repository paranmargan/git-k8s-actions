name: GKE CI-CD

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: project-5706452a-7c84-467b-abb
  REGION: us-central1
  REPOSITORY: k8s-images
  IMAGE_NAME: github-demo

jobs:

  # =========================================================
  # 1. TEST
  # =========================================================
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Display information
        run: |
          echo "Commit: $GITHUB_SHA"
          echo "Repository: $GITHUB_REPOSITORY"

      - name: Verify required files
        run: |
          test -f Dockerfile || {
            echo "Dockerfile not found!"
            exit 1
          }

          test -f index.html || {
            echo "index.html not found!"
            exit 1
          }

      - name: Validate HTML
        run: |
          grep -qi "GitHub Actions" index.html


  # =========================================================
  # 2. BUILD
  # =========================================================
  build:
    needs: test
    runs-on: ubuntu-latest

    outputs:
      image: ${{ steps.image.outputs.image }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: "projects/600309486002/locations/global/workloadIdentityPools/github-pool2/providers/github-provider"
          service_account: "github-gke-deployer@${{ env.PROJECT_ID }}.iam.gserviceaccount.com"

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure GCP project
        run: |
          gcloud config set project "$PROJECT_ID"

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker \
            "${REGION}-docker.pkg.dev" \
            --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push AMD64 image
        id: docker-build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Create immutable image reference
        id: image
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/${IMAGE_NAME}@${{ steps.docker-build.outputs.digest }}"

          echo "Immutable image:"
          echo "$IMAGE"

          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"


  # =========================================================
  # 3. DEPLOY DEV
  # =========================================================
  deploy-dev:
    needs: build
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: "projects/600309486002/locations/global/workloadIdentityPools/github-pool2/providers/github-provider"
          service_account: "github-gke-deployer@${{ env.PROJECT_ID }}.iam.gserviceaccount.com"

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Install Kustomize
        run: |
          curl -s \
            "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" \
            | bash

          sudo mv kustomize /usr/local/bin/kustomize

          kustomize version

      - name: Get DEV cluster credentials
        run: |
          gcloud container fleet memberships get-credentials \
            "${{ vars.CLUSTER }}" \
            --project="$PROJECT_ID"

      - name: Set DEV image
        env:
          IMAGE: ${{ needs.build.outputs.image }}
        run: |
          cd k8s/overlays/dev

          echo "Using immutable image:"
          echo "$IMAGE"

          kustomize edit set image \
            us-central1-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/${IMAGE_NAME}="$IMAGE"

      - name: Show rendered DEV manifest
        run: |
          kubectl kustomize k8s/overlays/dev

      - name: Deploy DEV
        run: |
          kubectl apply \
            -k k8s/overlays/dev

      - name: Wait for DEV rollout
        run: |
          kubectl rollout status \
            deployment/${IMAGE_NAME} \
            -n "${{ vars.NAMESPACE }}" \
            --timeout=180s

      - name: Verify DEV image
        run: |
          kubectl get deployment ${IMAGE_NAME} \
            -n "${{ vars.NAMESPACE }}" \
            -o jsonpath='{.spec.template.spec.containers[0].image}{"\n"}'


  # =========================================================
  # 4. DEPLOY PROD
  # =========================================================
  deploy-prod:
    needs:
      - build
      - deploy-dev

    runs-on: ubuntu-latest
    environment: prod

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: "projects/600309486002/locations/global/workloadIdentityPools/github-pool2/providers/github-provider"
          service_account: "github-gke-deployer@${{ env.PROJECT_ID }}.iam.gserviceaccount.com"

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Install Kustomize
        run: |
          curl -s \
            "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" \
            | bash

          sudo mv kustomize /usr/local/bin/kustomize

          kustomize version

      - name: Get PROD cluster credentials
        run: |
          gcloud container fleet memberships get-credentials \
            "${{ vars.CLUSTER }}" \
            --project="$PROJECT_ID"

      - name: Set PROD image
        env:
          IMAGE: ${{ needs.build.outputs.image }}
        run: |
          cd k8s/overlays/prod

          echo "Promoting exact image:"
          echo "$IMAGE"

          kustomize edit set image \
            us-central1-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/${IMAGE_NAME}="$IMAGE"

      - name: Show rendered PROD manifest
        run: |
          kubectl kustomize k8s/overlays/prod

      - name: Deploy PROD
        run: |
          kubectl apply \
            -k k8s/overlays/prod

      - name: Wait for PROD rollout
        run: |
          kubectl rollout status \
            deployment/${IMAGE_NAME} \
            -n "${{ vars.NAMESPACE }}" \
            --timeout=180s

      - name: Verify PROD image
        run: |
          kubectl get deployment ${IMAGE_NAME} \
            -n "${{ vars.NAMESPACE }}" \
            -o jsonpath='{.spec.template.spec.containers[0].image}{"\n"}'